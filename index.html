<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UsageTracker</title>
<style>
  /* Monad style reference: parchment canvas, serif display at weight 400,
     mono for every functional string, ash hairlines, pill containers, no
     shadows. Lake blue is spent once, on the primary action. The bar trio
     (ok/warn/bad) is functional and kept as is. */
  :root {
    --bg: #f6f3f1; --card: #f6f3f1; --raised: #cfdaf5; --fg: #242424; --body: #4e4d4d; --muted: #797776; --line: #cecac8;
    --ok: #2f9e5f; --warn: #d9932c; --bad: #d64545; --track: #e6e1dd;
    --claude: #c96a3a; --codex: #2b59d1; --accent: #2b59d1;
    --mono: "ABC Diatype Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    --serif: "Untitled Serif", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b1a; --card: #242424; --raised: #3b4a6b; --fg: #f6f3f1; --body: #d9d4d0; --muted: #a29e9b; --line: #4e4d4d; --track: #3a3938; --codex: #7d9df0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 18px/1.35 var(--mono); letter-spacing: -0.02em; }
  header { display: flex; align-items: baseline; gap: 24px; padding: 40px 40px 16px; max-width: 1432px; margin: 0 auto; }
  header h1 { font: 400 40px/1.2 var(--serif); letter-spacing: -0.02em; margin: 0; }
  header .meta { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: -0.02em; }
  button { font: 500 14px/1 var(--mono); text-transform: uppercase; letter-spacing: -0.02em; border-radius: 100px; padding: 14px 28px; cursor: pointer; }
  header #refresh { margin-left: auto; background: var(--accent); color: #f6f3f1; border: 1px solid var(--accent); }
  header #refresh:disabled { opacity: .5; cursor: default; }
  .days { display: flex; gap: 8px; }
  .days button { background: transparent; border: 1px solid var(--line); color: var(--body); padding: 12px 20px; }
  .days button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  #tokens, main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding: 16px 40px 0; max-width: 1432px; margin: 0 auto; }
  main { padding-bottom: 64px; }
  @media (max-width: 900px) { #tokens, main { grid-template-columns: 1fr; } }
  .card, .tokens { background: var(--card); border: 1px solid var(--line); border-radius: 40px; padding: 40px; }
  .card { display: flex; flex-direction: column; gap: 20px; }
  .card.err { border-color: var(--bad); }
  .top { display: flex; align-items: baseline; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; align-self: center; }
  .dot.claude { background: var(--claude); } .dot.codex { background: var(--codex); }
  .name { font: 400 32px/1.2 var(--serif); letter-spacing: -0.02em; }
  .plan { color: var(--muted); font-size: 14px; margin-left: auto; text-align: right; text-transform: uppercase; }
  .win { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  .win .label { font-size: 16px; color: var(--body); }
  .win .pct { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 20px; }
  .bar { grid-column: 1 / -1; height: 10px; margin: 4px 0; background: var(--track); border-radius: 100px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 100px; background: var(--ok); transition: width .4s; }
  .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
  .reset { grid-column: 1 / -1; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .notes, .warnings, .error { font-size: 14px; }
  .notes { color: var(--muted); } .warnings { color: var(--warn); } .error { color: var(--bad); white-space: pre-wrap; word-break: break-word; }
  .foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; text-transform: uppercase; }
  .stale { color: var(--warn); }
  code { font-family: inherit; font-size: inherit; text-transform: none; }
  .tokens { display: grid; gap: 8px; }
  .tokens .head { display: flex; align-items: baseline; gap: 12px; }
  .tokens .head .name { font-size: 24px; }
  .tokens .head .dot { margin-right: 4px; }
  .tokens .head .total { font-weight: 500; font-size: 28px; font-variant-numeric: tabular-nums; margin-left: auto; }
  .tokens .split, .tokens .models, .tokens .cost { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tokens .cost b { color: var(--fg); font-weight: 500; }
  .tokens .note { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-top: 8px; }
  .strip { display: flex; align-items: flex-end; gap: 3px; height: 48px; margin-top: 8px; }
  .strip i { flex: 1; background: var(--codex); opacity: .6; border-radius: 100px 100px 0 0; min-height: 2px; }
  .strip i.zero { background: var(--track); opacity: 1; }
  .tokens[data-kind="claude"] .strip i { background: var(--claude); }
  .tokens[data-kind="claude"] .strip i.zero { background: var(--track); }
</style>
</head>
<body>
<header>
  <h1>UsageTracker</h1>
  <span class="meta" id="meta">loading</span>
  <span class="days" id="days"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></span>
  <button id="refresh">Refresh now</button>
</header>
<section id="tokens"></section>
<main id="main"></main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function ago(iso) {
    if (!iso) return "";
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
  }
  function until(iso) {
    if (!iso) return "";
    const s = Math.round((Date.parse(iso) - Date.now()) / 1000);
    if (s <= 0) return "resets now";
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    const t = new Date(iso);
    const clock = d >= 1 ? t.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return `resets in ${d ? d + "d " : ""}${h}h ${m}m (${clock})`;
  }
  function cls(p) { return p >= 90 ? "bad" : p >= 70 ? "warn" : ""; }
  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
    return String(n);
  }
  function usd(n) { return n >= 100 ? "$" + Math.round(n) : "$" + n.toFixed(2); }

  const KIND = { claude: "Claude Code", codex: "Codex" };
  function tokensBlock(t) {
    const head = `<div class="head"><span class="dot ${esc(t.kind)}"></span><span class="name">${KIND[t.kind]} tokens, last ${t.days}d</span>`;
    if (!t.files) return `<div class="tokens" data-kind="${esc(t.kind)}">${head}<span class="total">no transcripts</span></div></div>`;
    const max = Math.max(1, ...t.series.map((d) => d.total));
    const strip = t.series.map((d) => `<i class="${d.total ? "" : "zero"}" style="height:${Math.max(2, Math.round(d.total / max * 100))}%" title="${d.day}: ${fmt(d.total)}${d.costUsd ? " · " + usd(d.costUsd) : ""}"></i>`).join("");
    const models = Object.entries(t.byModel).sort((a, b) => b[1].total - a[1].total).slice(0, 3)
      .map(([m, v]) => `${esc(m.replace(/-\d{8}$/, ""))} ${fmt(v.total)}`).join(" · ");
    const cost = t.costUsd || t.unpriced
      ? `<div class="cost">${t.costUsd ? `<b>${usd(t.costUsd)}</b> API-equivalent` : ""}${t.unpriced ? `${t.costUsd ? ", " : ""}${fmt(t.unpriced)} tokens unpriced` : ""}</div>` : "";
    return `
      <div class="tokens" data-kind="${esc(t.kind)}">
        ${head}<span class="total">${fmt(t.total)}</span></div>
        <div class="split">in ${fmt(t.uncachedIn)} · cached ${fmt(t.cachedIn)} · cache write ${fmt(t.cacheWrite)} · out ${fmt(t.out)}</div>
        ${cost}
        ${models ? `<div class="models">${models}</div>` : ""}
        <div class="strip">${strip}</div>
        <div class="note">all accounts on this machine, from <code>${t.dirs.map(esc).join("</code>, <code>")}</code></div>
      </div>`;
  }

  function card(a) {
    const d = a.data;
    const win = (w) => `
      <div class="win">
        <span class="label">${esc(w.label)}</span>
        <span class="pct">${Math.round(w.usedPercent)}% used</span>
        <div class="bar ${cls(w.usedPercent)}"><i style="width:${Math.min(100, Math.max(0, w.usedPercent))}%"></i></div>
        <span class="reset">${esc(until(w.resetsAt))}</span>
      </div>`;
    const body = d
      ? (d.windows.length ? d.windows.map(win).join("") : `<div class="notes">no active rate-limit window</div>`)
        + (d.notes?.length ? `<div class="notes">${d.notes.map(esc).join("<br>")}</div>` : "")
        + (d.warnings?.length ? `<div class="warnings">${d.warnings.map(esc).join("<br>")}</div>` : "")
      : "";
    const err = a.ok ? "" : `<div class="error">${esc(a.error)}</div>`;
    const stale = !a.ok && d ? `<span class="stale">showing data from ${ago(a.lastGoodAt)}</span>` : `<span>${a.ok ? "fetched " + ago(a.fetchedAt) : ""}</span>`;
    return `
      <section class="card ${a.ok ? "" : "err"}">
        <div class="top">
          <span class="dot ${esc(a.kind)}"></span>
          <span class="name">${esc(a.name)}</span>
          <span class="plan">${esc(d?.plan ?? "")}${d?.email ? `<br>${esc(d.email)}` : ""}</span>
        </div>
        ${body}${err}
        <div class="foot">${stale}<code>${esc(a.dir ?? "")}</code></div>
      </section>`;
  }

  let last = null, tokens = null, days = 30;
  async function load() {
    try {
      const [r, t] = await Promise.all([fetch("/api/usage", { cache: "no-store" }), fetch(`/api/tokens?days=${days}`, { cache: "no-store" })]);
      last = await r.json();
      tokens = await t.json();
      render();
    } catch (e) {
      $("#meta").textContent = `server unreachable: ${e.message}`;
    }
  }
  function render() {
    if (!last) return;
    $("#main").innerHTML = last.accounts.map(card).join("");
    if (tokens) $("#tokens").innerHTML = tokens.providers.map(tokensBlock).join("");
    const ok = last.accounts.filter((a) => a.ok).length;
    $("#meta").textContent = `${ok}/${last.accounts.length} accounts live · ${new Date().toLocaleTimeString()}`;
  }
  $("#days").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    days = Number(b.dataset.d);
    for (const x of $("#days").children) x.classList.toggle("on", x === b);
    load();
  });
  $("#refresh").addEventListener("click", async () => {
    $("#refresh").disabled = true;
    try { await fetch("/api/refresh", { method: "POST" }); await load(); } finally { $("#refresh").disabled = false; }
  });
  load();
  setInterval(load, 30_000);
  setInterval(render, 15_000); // keep countdowns moving between fetches
</script>
</body>
</html>
