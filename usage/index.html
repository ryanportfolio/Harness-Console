<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<style>
  /* Vellum style: one warm sand canvas, near-black ink, a single sans typeface
     doing all the hierarchy work, hairline rules instead of containers, zero
     radius, no shadows, no dark mode. Series are shades of the earth palette:
     Claude in bronze, Codex in ink; segments keep their alpha steps. Usage
     bars darken as they fill (hayfield, bronze, ink). */
  :root {
    --bg: #f4e6cd; --card: #f4e6cd; --linen: #edddc3; --fg: #1e211e; --body: #1e211e; --muted: #8f774b; --line: #1e211e;
    --ok: #ba9d6a; --warn: #8f774b; --bad: #1e211e; --track: #edddc3;
    --claude: #8f774b; --codex: #1e211e; --accent: #1e211e;
    --sans: Verdana, Geneva, "DejaVu Sans", sans-serif;
    --mono: var(--sans); --serif: var(--sans);
  }
  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--sans); }
  header { display: flex; align-items: baseline; gap: 24px; padding: 14px 40px 6px; max-width: 1432px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  header h1 { font: 500 40px/1.2 var(--sans); letter-spacing: -0.03em; margin: 0; }
  header .meta { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
  button { font: 400 14px/1.5 var(--sans); text-transform: uppercase; letter-spacing: .04em; border: 0; border-radius: 0; padding: 0; background: transparent; color: var(--fg); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  button:hover { text-decoration-thickness: 2px; }
  header #refresh { margin-left: auto; font-size: 20px; font-weight: 700; text-transform: none; letter-spacing: 0; }
  header #refresh::after { content: " ↗"; }
  header #refresh:disabled { color: var(--muted); cursor: default; text-decoration: none; }
  .days { display: flex; gap: 16px; }
  .days button { color: var(--muted); text-decoration: none; }
  .days button.on { color: var(--fg); text-decoration: underline; }
  #tokens, main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 60px; padding: 0 40px; max-width: 1432px; margin: 0 auto; }
  #tokens { padding-top: 6px; }
  main { padding-bottom: 16px; }
  @media (max-width: 900px) { #tokens, main { grid-template-columns: 1fr; } }
  .card, .tokens { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 0 16px; }
  .card { display: flex; flex-direction: column; gap: 10px; }
  .card.err .name::after { content: " · error"; color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
  .top { display: flex; align-items: baseline; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 0; flex: none; align-self: center; }
  .dot.claude { background: var(--claude); } .dot.codex { background: var(--codex); }
  .name { font: 500 24px/1.4 var(--sans); letter-spacing: -0.01em; }
  .plan { color: var(--muted); font-size: 14px; margin-left: auto; text-align: right; text-transform: uppercase; letter-spacing: .04em; }
  .win { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
  .win .label { font-size: 16px; color: var(--body); }
  .win .pct { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 16px; }
  .bar { grid-column: 1 / -1; height: 6px; margin: 2px 0; background: var(--track); border-radius: 0; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 0; background: var(--ok); transition: width .4s; }
  .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
  .reset { grid-column: 1 / -1; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .notes, .warnings, .error { font-size: 14px; }
  button.login { margin-top: 6px; font-size: 16px; font-weight: 700; text-transform: none; letter-spacing: 0; }
  .notes { color: var(--muted); } .warnings { color: var(--warn); } .error { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  .top .when { display: flex; gap: 10px; align-self: center; margin-left: 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .top .when code { cursor: default; }
  .stale { color: var(--warn); }
  code { font-family: inherit; font-size: inherit; text-transform: none; }
  .tokens { display: grid; gap: 4px; }
  .tokens .head { display: flex; align-items: baseline; gap: 12px; }
  .tokens .head .name { font-size: 24px; }
  .tokens .head .dot { margin-right: 4px; }
  .tokens .head .total { font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; margin-left: auto; }
  .tokens .row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .tokens .row .hd { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; width: 72px; flex: none; }
  .stack { display: flex; flex: 1; height: 10px; border-radius: 0; overflow: hidden; background: var(--track); gap: 2px; }
  .stack i { display: block; height: 100%; min-width: 2px; background: var(--hue); cursor: default; }
  .stack i:hover, .stack i:focus-visible { filter: brightness(.85); outline: none; }
  .tokens .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); padding-left: 84px; }
  .tokens .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 0; background: var(--sw); margin-right: 6px; vertical-align: -1px; }
  .tokens[data-kind="claude"] { --hue: var(--claude); } .tokens[data-kind="codex"] { --hue: var(--codex); }
  .tokens .foot { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tokens .foot .pill { border: 0; border-radius: 0; padding: 0; color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tokens .foot .pill.warn { color: var(--warn); }
  .strip { display: flex; align-items: stretch; gap: 3px; height: 32px; margin-top: 6px; }
  .strip .col { flex: 1; display: flex; align-items: flex-end; min-width: 0; cursor: default; outline: none; }
  .strip .col:hover, .strip .col:focus-visible { background: var(--track); }
  .strip i { display: block; width: 100%; background: var(--hue); opacity: .6; border-radius: 0; min-height: 2px; }
  .strip .col:hover i, .strip .col:focus-visible i { opacity: 1; }
  .strip i.zero { background: var(--track); opacity: 1; }
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--fg); color: var(--bg); font: 400 14px/1.35 var(--sans); padding: 6px 10px; border-radius: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Usage</h1>
  <span class="meta" id="meta">loading</span>
  <span class="days" id="days"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></span>
  <button id="refresh">Refresh now</button>
</header>
<section id="tokens"></section>
<div id="tip"></div>
<main id="main"></main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function ago(iso) {
    if (!iso) return "";
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
  }
  function until(iso) {
    if (!iso) return "";
    const s = Math.round((Date.parse(iso) - Date.now()) / 1000);
    if (s <= 0) return "resets now";
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    const t = new Date(iso);
    const clock = d >= 1 ? t.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return `resets in ${d ? d + "d " : ""}${h}h ${m}m (${clock})`;
  }
  function cls(p) { return p >= 90 ? "bad" : p >= 70 ? "warn" : ""; }
  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
    return String(n);
  }
  function usd(n) { return n >= 100 ? "$" + Math.round(n) : "$" + n.toFixed(2); }

  const KIND = { claude: "Claude Code", codex: "Codex" };
  // Stacked bar: segments proportional to `parts` [{label, value, alpha}], numbers live in the tooltip.
  function stack(parts, total, unit) {
    const seg = parts.filter((p) => p.value > 0).map((p) =>
      `<i style="flex:${p.value};opacity:${p.alpha}" tabindex="0" role="img" aria-label="${esc(p.label)} · ${unit(p.value)} · ${(p.value / total * 100).toFixed(1)}%" data-tip="${esc(p.label)} · ${unit(p.value)} · ${(p.value / total * 100).toFixed(1)}%"></i>`).join("");
    const legend = parts.filter((p) => p.value > 0).map((p) =>
      `<span style="--sw:color-mix(in srgb, var(--hue) ${Math.round(p.alpha * 100)}%, var(--track))">${esc(p.label)}</span>`).join("");
    return { seg, legend };
  }
  function tokensBlock(t) {
    const head = `<div class="head"><span class="dot ${esc(t.kind)}"></span><span class="name">${KIND[t.kind]} tokens, last ${t.days}d</span>`;
    if (!t.files) return `<div class="tokens" data-kind="${esc(t.kind)}">${head}<span class="total">no transcripts</span></div></div>`;
    const max = Math.max(1, ...t.series.map((d) => d.total));
    const day = (d) => new Date(d.day + "T00:00").toLocaleDateString([], { month: "short", day: "numeric" });
    // Each day is a full-height column so the tooltip triggers anywhere above the bar, not only on a 2px sliver.
    const strip = t.series.map((d) => `<span class="col" tabindex="0" role="img" aria-label="${day(d)} · ${fmt(d.total)}${d.costUsd ? " · " + usd(d.costUsd) : ""}" data-tip="${day(d)} · ${fmt(d.total)}${d.costUsd ? " · " + usd(d.costUsd) : ""}"><i class="${d.total ? "" : "zero"}" style="height:${Math.max(2, Math.round(d.total / max * 100))}%"></i></span>`).join("");
    const split = stack([
      { label: "input", value: t.uncachedIn, alpha: 1 }, { label: "cache read", value: t.cachedIn, alpha: .45 },
      { label: "cache write", value: t.cacheWrite, alpha: .25 }, { label: "output", value: t.out, alpha: .7 },
    ], t.total, fmt);
    const top = Object.entries(t.byModel).sort((a, b) => b[1].total - a[1].total);
    const alphas = [1, .6, .35, .18];
    const parts = top.slice(0, 3).map(([m, v], i) => ({ label: m.replace(/-\d{8}$/, ""), value: v.total, alpha: alphas[i] }));
    const rest = top.slice(3).reduce((n, [, v]) => n + v.total, 0);
    if (rest) parts.push({ label: `${top.length - 3} other`, value: rest, alpha: alphas[3] });
    const models = stack(parts, t.total, fmt);
    return `
      <div class="tokens" data-kind="${esc(t.kind)}">
        ${head}<span class="total">${fmt(t.total)}</span></div>
        <div class="row"><span class="hd">split</span><div class="stack">${split.seg}</div></div>
        <div class="legend">${split.legend}</div>
        <div class="row"><span class="hd">models</span><div class="stack">${models.seg}</div></div>
        <div class="legend">${models.legend}</div>
        <div class="strip">${strip}</div>
        <div class="foot">
          ${t.costUsd ? `<span class="pill" data-tip="same traffic at public API rates, LiteLLM table">${usd(t.costUsd)} API-equivalent</span>` : ""}
          ${t.unpriced ? `<span class="pill warn" data-tip="no price for these models; add priceAliases in accounts.json">${fmt(t.unpriced)} unpriced</span>` : ""}
          <span data-tip="${esc(t.dirs.join(" · "))}">all accounts on this machine</span>
        </div>
      </div>`;
  }

  const path = { basename: (p) => p.split(/[\\/]/).filter(Boolean).pop() ?? "" };
  function card(a) {
    const d = a.data;
    const win = (w) => `
      <div class="win">
        <span class="label">${esc(w.label)}</span>
        <span class="pct">${Math.round(w.usedPercent)}% used</span>
        <div class="bar ${cls(w.usedPercent)}"><i style="width:${Math.min(100, Math.max(0, w.usedPercent))}%"></i></div>
        <span class="reset">${esc(until(w.resetsAt))}</span>
      </div>`;
    const body = d
      ? (d.windows.length ? d.windows.map(win).join("") : `<div class="notes">no active rate-limit window</div>`)
        + (d.notes?.length ? `<div class="notes">${d.notes.map(esc).join("<br>")}</div>` : "")
        + (d.warnings?.length ? `<div class="warnings">${d.warnings.map(esc).join("<br>")}</div>` : "")
      : "";
    const needsLogin = !a.ok && /run `(claude|codex)/.test(a.error ?? "");
    const err = a.ok ? "" : `<div class="error">${esc(a.error)}${needsLogin ? `<br><button class="login" data-account="${esc(a.name)}">Sign in again</button>` : ""}</div>`;
    const stale = !a.ok && d ? `<span class="stale">showing data from ${ago(a.lastGoodAt)}</span>` : `<span>${a.ok ? "fetched " + ago(a.fetchedAt) : ""}</span>`;
    return `
      <section class="card ${a.ok ? "" : "err"}">
        <div class="top">
          <span class="dot ${esc(a.kind)}"></span>
          <span class="name">${esc(a.name)}</span>
          <span class="when">${stale}<code data-tip="${esc(a.dir ?? "")}">${esc(path.basename(a.dir ?? ""))}</code></span>
          <span class="plan">${esc(d?.plan ?? "")}${d?.email ? `<br>${esc(d.email)}` : ""}</span>
        </div>
        ${body}${err}
      </section>`;
  }

  let last = null, tokens = null, days = 30;
  async function load() {
    try {
      const [r, t] = await Promise.all([fetch("/api/usage", { cache: "no-store" }), fetch(`/api/tokens?days=${days}`, { cache: "no-store" })]);
      last = await r.json();
      tokens = await t.json();
      render();
    } catch (e) {
      $("#meta").textContent = `server unreachable: ${e.message}`;
    }
  }
  function render() {
    if (!last) return;
    $("#main").innerHTML = last.accounts.map(card).join("");
    if (tokens) $("#tokens").innerHTML = tokens.providers.map(tokensBlock).join("");
    const ok = last.accounts.filter((a) => a.ok).length;
    $("#meta").textContent = `${ok}/${last.accounts.length} accounts live · ${new Date().toLocaleTimeString()}`;
  }
  const tip = $("#tip");
  document.addEventListener("pointerover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) { tip.style.display = "none"; return; }
    tip.textContent = el.dataset.tip; tip.style.display = "block";
  });
  document.addEventListener("pointermove", (e) => {
    if (tip.style.display !== "block") return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
    tip.style.top = (e.clientY - h - 14 < 0 ? e.clientY + 18 : e.clientY - h - 14) + "px";
  });
  document.addEventListener("pointerout", (e) => { if (e.target.closest("[data-tip]") && !e.relatedTarget?.closest?.("[data-tip]")) tip.style.display = "none"; });
  // Keyboard: Tab onto a segment or day bar shows the same tooltip above it.
  document.addEventListener("focusin", (e) => {
    const el = e.target.closest("[data-tip]"); if (!el) return;
    const r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip; tip.style.display = "block";
    tip.style.left = Math.min(r.left, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
  });
  document.addEventListener("focusout", (e) => { if (e.target.closest?.("[data-tip]")) tip.style.display = "none"; });
  $("#days").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    days = Number(b.dataset.d);
    for (const x of $("#days").children) x.classList.toggle("on", x === b);
    load();
  });
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button.login"); if (!b) return;
    b.disabled = true;
    const r = await fetch(`/api/login?account=${encodeURIComponent(b.dataset.account)}`, { method: "POST" });
    b.replaceWith(Object.assign(document.createElement("span"), { className: "notes", textContent: r.ok ? "A console window opened. Finish the browser sign-in there, then press Refresh now." : `Could not open the sign-in window (${r.status}).` }));
  });
  $("#refresh").addEventListener("click", async () => {
    $("#refresh").disabled = true;
    try { await fetch("/api/refresh", { method: "POST" }); await load(); } finally { $("#refresh").disabled = false; }
  });
  // A page load acts like "Refresh now": show the cached snapshot at once, then pull fresh numbers.
  // The server skips accounts fetched within the last few minutes, so reloads cannot trip the 429 backoff.
  load().then(() => fetch("/api/refresh", { method: "POST" })).then(load).catch(() => {});
  setInterval(load, 30_000);
  setInterval(render, 15_000); // keep countdowns moving between fetches
</script>
</body>
</html>
