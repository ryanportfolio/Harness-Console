name: readme
on:
  push:
    branches: [main]
  pull_request:
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/readme/build.mjs
      - name: README and panels match the source
        run: |
          git diff --exit-code -- README.md assets/readme
          if [ -n "$(git status --porcelain -- README.md assets/readme)" ]; then
            echo "generated files missing from the commit:"; git status --porcelain -- README.md assets/readme; exit 1
          fi
