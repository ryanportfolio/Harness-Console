<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1031" width="390" height="1031" role="img" aria-label="Harness Console: the app on port 43127, the usage tracker on port 4545. Usage tracker schedule board: 4 Claude Code rate-limit windows and 2 Codex windows, fetched through CLIProxyAPI at startup, on page load and on Refresh now with no poll timer; token totals over 7, 30 and 90 days rescanned every 300 seconds; and the sign-in watch, which refreshes every 5 seconds for up to 10 minutes after the proxy's sign-in page opens.">
<style>
.ttl{font-family:'Untitled Serif',ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;font-weight:400;fill:#242424;letter-spacing:-0.02em}
.lbl{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#242424;letter-spacing:-0.02em}
.bdy{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#4e4d4d;letter-spacing:-0.02em}
.mut{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#797776;letter-spacing:-0.02em}
.hd{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#797776;letter-spacing:0.08em}
.num{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#242424;font-variant-numeric:tabular-nums}
.rule{stroke:#cecac8;stroke-width:1}
.card{fill:#f6f3f1;stroke:#cecac8;stroke-width:1}
.pill{fill:none;stroke:#cecac8;stroke-width:1}
.face{fill:none;stroke:#e6e1dd;stroke-width:3}
.hand{fill:none;stroke:#242424;stroke-width:3;stroke-dasharray:50.27;stroke-dashoffset:0;animation-name:drain;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:50.27}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hand{stroke-dashoffset:0}}</style>
<defs><filter id="w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff9473" stop-opacity="0.55"/><stop offset="1" stop-color="#a0b5eb" stop-opacity="0.55"/></linearGradient><clipPath id="c"><rect x="0.5" y="0.5" width="389" height="1030" rx="24"/></clipPath></defs>
<rect x="0.5" y="0.5" width="389" height="1030" rx="24" class="card"/>
<g clip-path="url(#c)"><ellipse cx="350" cy="30" rx="120" ry="60" fill="url(#g)" filter="url(#w)"/></g>
<text x="24" y="64" class="ttl" font-size="36">Harness Console</text>
<text x="24" y="94" class="bdy" font-size="13">One local app for Harness Firmware</text>
<text x="24" y="113.5" class="bdy" font-size="13">repositories, plus a usage tracker:</text>
<text x="24" y="133" class="bdy" font-size="13">rate-limit windows and reset clocks for</text>
<text x="24" y="152.5" class="bdy" font-size="13">every Claude Code and Codex login in</text>
<text x="24" y="172" class="bdy" font-size="13">CLIProxyAPI, and token totals from this</text>
<text x="24" y="191.5" class="bdy" font-size="13">machine's transcripts.</text>
<rect x="24" y="209" width="90" height="23" rx="17" class="pill"/><text x="36" y="225" class="mut" font-size="11">APP :43127</text>
<rect x="122" y="209" width="96.6" height="23" rx="17" class="pill"/><text x="134" y="225" class="mut" font-size="11">USAGE :4545</text>
<rect x="226.6" y="209" width="116.39999999999999" height="23" rx="17" class="pill"/><text x="238.6" y="225" class="mut" font-size="11">0 DEPENDENCIES</text>
<text x="24" y="265" text-anchor="start" class="hd" font-size="11">WINDOW</text>
<text x="236" y="265" text-anchor="start" class="hd" font-size="11">LENGTH</text>
<text x="366" y="265" text-anchor="end" class="hd" font-size="11">POLLED</text>
<line x1="24" x2="366" y1="275" y2="275" class="rule"/>
<circle cx="29" cy="302" r="5" fill="#c96a3a"/>
<text x="42" y="307" class="lbl" font-size="13">Claude Code</text>
<text x="366" y="307" text-anchor="end" class="mut" font-size="11">api.anthropic.com</text>
<text x="24" y="347" class="lbl" font-size="13">Session (5h)</text>
<g transform="rotate(-90 244 342)"><circle cx="244" cy="342" r="8" class="face"/><circle cx="244" cy="342" r="8" class="hand" style="animation-duration:5s"/></g>
<text x="260" y="347" class="num" font-size="12">5 h</text>
<text x="366" y="347" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="361" y2="361" class="rule"/>
<text x="24" y="387" class="lbl" font-size="13">Weekly</text>
<g transform="rotate(-90 244 382)"><circle cx="244" cy="382" r="8" class="face"/><circle cx="244" cy="382" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="387" class="num" font-size="12">7 d</text>
<text x="366" y="387" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="401" y2="401" class="rule"/>
<text x="24" y="427" class="lbl" font-size="13">Weekly Opus</text>
<g transform="rotate(-90 244 422)"><circle cx="244" cy="422" r="8" class="face"/><circle cx="244" cy="422" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="427" class="num" font-size="12">7 d</text>
<text x="366" y="427" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="441" y2="441" class="rule"/>
<text x="24" y="467" class="lbl" font-size="13">Weekly Sonnet</text>
<g transform="rotate(-90 244 462)"><circle cx="244" cy="462" r="8" class="face"/><circle cx="244" cy="462" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="467" class="num" font-size="12">7 d</text>
<text x="366" y="467" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="481" y2="481" class="rule"/>
<circle cx="29" cy="494" r="5" fill="#2b59d1"/>
<text x="42" y="499" class="lbl" font-size="13">Codex</text>
<text x="366" y="499" text-anchor="end" class="mut" font-size="11">chatgpt.com</text>
<text x="24" y="539" class="lbl" font-size="13">Session (5h)</text>
<g transform="rotate(-90 244 534)"><circle cx="244" cy="534" r="8" class="face"/><circle cx="244" cy="534" r="8" class="hand" style="animation-duration:5s"/></g>
<text x="260" y="539" class="num" font-size="12">5 h</text>
<text x="366" y="539" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="553" y2="553" class="rule"/>
<text x="24" y="579" class="lbl" font-size="13">Weekly</text>
<g transform="rotate(-90 244 574)"><circle cx="244" cy="574" r="8" class="face"/><circle cx="244" cy="574" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="579" class="num" font-size="12">7 d</text>
<text x="366" y="579" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="593" y2="593" class="rule"/>
<text x="24" y="611" class="lbl" font-size="13">Tokens</text>
<text x="366" y="611" text-anchor="end" class="mut" font-size="11">local transcripts</text>
<text x="24" y="651" class="lbl" font-size="13">Last 7 / 30 / 90 d</text>
<text x="366" y="651" text-anchor="end" class="num" font-size="12">300 s</text>
<g transform="rotate(-90 32 670)"><circle cx="32" cy="670" r="8" class="face"/><circle cx="32" cy="670" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="48" y="675" class="num" font-size="12">7 d</text>
<g transform="rotate(-90 91.6 670)"><circle cx="91.6" cy="670" r="8" class="face"/><circle cx="91.6" cy="670" r="8" class="hand" style="animation-duration:720s"/></g>
<text x="107.6" y="675" class="num" font-size="12">30 d</text>
<g transform="rotate(-90 158.39999999999998 670)"><circle cx="158.39999999999998" cy="670" r="8" class="face"/><circle cx="158.39999999999998" cy="670" r="8" class="hand" style="animation-duration:2160s"/></g>
<text x="174.39999999999998" y="675" class="num" font-size="12">90 d</text>
<line x1="24" x2="366" y1="689" y2="689" class="rule"/>
<text x="24" y="707" class="lbl" font-size="13">CLIProxyAPI</text>
<text x="366" y="707" text-anchor="end" class="mut" font-size="11">127.0.0.1:8317</text>
<text x="24" y="747" class="lbl" font-size="13">Sign-in watch</text>
<text x="366" y="747" text-anchor="end" class="num" font-size="12">5 s</text>
<text x="24" y="771" class="mut" font-size="11">up to 10 min</text>
<line x1="24" x2="366" y1="785" y2="785" class="rule"/>
<line x1="24" x2="366" y1="795" y2="795" class="rule"/>
<text x="24" y="821" class="hd" font-size="11">DASHBOARD BARS</text>
<rect x="22" y="833" width="24" height="10" fill="#edddc3"/><rect x="24" y="835" width="20" height="6" fill="#ba9d6a"/>
<text x="50" y="843" class="mut" font-size="11">under 70% used</text>
<rect x="150.39999999999998" y="833" width="24" height="10" fill="#edddc3"/><rect x="152.39999999999998" y="835" width="20" height="6" fill="#8f774b"/>
<text x="178.39999999999998" y="843" class="mut" font-size="11">70% and over</text>
<rect x="265.59999999999997" y="833" width="24" height="10" fill="#edddc3"/><rect x="267.59999999999997" y="835" width="20" height="6" fill="#1e211e"/>
<text x="293.59999999999997" y="843" class="mut" font-size="11">90% and over</text>
<text x="24" y="869" class="mut" font-size="11">Clocks drain at 1 s per hour of window: a 5 h</text>
<text x="24" y="885.5" class="mut" font-size="11">window empties every 5 s, 7 days every 168 s, 90</text>
<text x="24" y="902" class="mut" font-size="11">days every 2160 s.</text>
<text x="24" y="924" class="mut" font-size="11">on load: no poll timer. Each login is fetched</text>
<text x="24" y="940.5" class="mut" font-size="11">through CLIProxyAPI at startup, on every page load</text>
<text x="24" y="957" class="mut" font-size="11">and on Refresh now; one fetched fine under 60 s</text>
<text x="24" y="973.5" class="mut" font-size="11">ago, and not flagged by the proxy, keeps its</text>
<text x="24" y="990" class="mut" font-size="11">numbers.</text>
</svg>
