<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 963" width="390" height="963" role="img" aria-label="Harness Console: the app on port 43127, the usage tracker on port 4545. Usage tracker schedule board: 4 Claude Code rate-limit windows fetched at startup, on page load and on Refresh now (poll timer off), 2 Codex windows fetched at startup, on page load and on Refresh now (poll timer off), token totals over 7, 30 and 90 days rescanned every 300 seconds, and one write, the Claude token refresh.">
<style>
.ttl{font-family:'Untitled Serif',ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;font-weight:400;fill:#f6f3f1;letter-spacing:-0.02em}
.lbl{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#f6f3f1;letter-spacing:-0.02em}
.bdy{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#d9d4d0;letter-spacing:-0.02em}
.mut{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#a29e9b;letter-spacing:-0.02em}
.hd{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#a29e9b;letter-spacing:0.08em}
.num{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#f6f3f1;font-variant-numeric:tabular-nums}
.rule{stroke:#4e4d4d;stroke-width:1}
.card{fill:#242424;stroke:#4e4d4d;stroke-width:1}
.pill{fill:none;stroke:#4e4d4d;stroke-width:1}
.face{fill:none;stroke:#3a3938;stroke-width:3}
.hand{fill:none;stroke:#f6f3f1;stroke-width:3;stroke-dasharray:50.27;stroke-dashoffset:0;animation-name:drain;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:50.27}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hand{stroke-dashoffset:0}}</style>
<defs><filter id="w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff9473" stop-opacity="0.55"/><stop offset="1" stop-color="#a0b5eb" stop-opacity="0.55"/></linearGradient><clipPath id="c"><rect x="0.5" y="0.5" width="389" height="962" rx="24"/></clipPath></defs>
<rect x="0.5" y="0.5" width="389" height="962" rx="24" class="card"/>
<g clip-path="url(#c)"><ellipse cx="350" cy="30" rx="120" ry="60" fill="url(#g)" filter="url(#w)"/></g>
<text x="24" y="64" class="ttl" font-size="36">Harness Console</text>
<text x="24" y="94" class="bdy" font-size="13">One local app for Harness Firmware</text>
<text x="24" y="113.5" class="bdy" font-size="13">repositories, plus a usage tracker:</text>
<text x="24" y="133" class="bdy" font-size="13">rate-limit windows, reset clocks and token</text>
<text x="24" y="152.5" class="bdy" font-size="13">totals for every Claude Code and Codex</text>
<text x="24" y="172" class="bdy" font-size="13">account on this machine.</text>
<rect x="24" y="189.5" width="90" height="23" rx="17" class="pill"/><text x="36" y="205.5" class="mut" font-size="11">APP :43127</text>
<rect x="122" y="189.5" width="96.6" height="23" rx="17" class="pill"/><text x="134" y="205.5" class="mut" font-size="11">USAGE :4545</text>
<rect x="226.6" y="189.5" width="116.39999999999999" height="23" rx="17" class="pill"/><text x="238.6" y="205.5" class="mut" font-size="11">0 DEPENDENCIES</text>
<text x="24" y="245.5" text-anchor="start" class="hd" font-size="11">WINDOW</text>
<text x="236" y="245.5" text-anchor="start" class="hd" font-size="11">LENGTH</text>
<text x="366" y="245.5" text-anchor="end" class="hd" font-size="11">POLLED</text>
<line x1="24" x2="366" y1="255.5" y2="255.5" class="rule"/>
<circle cx="29" cy="282.5" r="5" fill="#e0824f"/>
<text x="42" y="287.5" class="lbl" font-size="13">Claude Code</text>
<text x="366" y="287.5" text-anchor="end" class="mut" font-size="11">api.anthropic.com</text>
<text x="24" y="327.5" class="lbl" font-size="13">Session (5h)</text>
<g transform="rotate(-90 244 322.5)"><circle cx="244" cy="322.5" r="8" class="face"/><circle cx="244" cy="322.5" r="8" class="hand" style="animation-duration:5s"/></g>
<text x="260" y="327.5" class="num" font-size="12">5 h</text>
<text x="366" y="327.5" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="341.5" y2="341.5" class="rule"/>
<text x="24" y="367.5" class="lbl" font-size="13">Weekly</text>
<g transform="rotate(-90 244 362.5)"><circle cx="244" cy="362.5" r="8" class="face"/><circle cx="244" cy="362.5" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="367.5" class="num" font-size="12">7 d</text>
<text x="366" y="367.5" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="381.5" y2="381.5" class="rule"/>
<text x="24" y="407.5" class="lbl" font-size="13">Weekly Opus</text>
<g transform="rotate(-90 244 402.5)"><circle cx="244" cy="402.5" r="8" class="face"/><circle cx="244" cy="402.5" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="407.5" class="num" font-size="12">7 d</text>
<text x="366" y="407.5" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="421.5" y2="421.5" class="rule"/>
<text x="24" y="447.5" class="lbl" font-size="13">Weekly Sonnet</text>
<g transform="rotate(-90 244 442.5)"><circle cx="244" cy="442.5" r="8" class="face"/><circle cx="244" cy="442.5" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="447.5" class="num" font-size="12">7 d</text>
<text x="366" y="447.5" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="461.5" y2="461.5" class="rule"/>
<circle cx="29" cy="474.5" r="5" fill="#7d9df0"/>
<text x="42" y="479.5" class="lbl" font-size="13">Codex</text>
<text x="366" y="479.5" text-anchor="end" class="mut" font-size="11">chatgpt.com</text>
<text x="24" y="519.5" class="lbl" font-size="13">Session (5h)</text>
<g transform="rotate(-90 244 514.5)"><circle cx="244" cy="514.5" r="8" class="face"/><circle cx="244" cy="514.5" r="8" class="hand" style="animation-duration:5s"/></g>
<text x="260" y="519.5" class="num" font-size="12">5 h</text>
<text x="366" y="519.5" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="533.5" y2="533.5" class="rule"/>
<text x="24" y="559.5" class="lbl" font-size="13">Weekly</text>
<g transform="rotate(-90 244 554.5)"><circle cx="244" cy="554.5" r="8" class="face"/><circle cx="244" cy="554.5" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="260" y="559.5" class="num" font-size="12">7 d</text>
<text x="366" y="559.5" text-anchor="end" class="num" font-size="12">on load</text>
<line x1="24" x2="366" y1="573.5" y2="573.5" class="rule"/>
<text x="24" y="591.5" class="lbl" font-size="13">Tokens</text>
<text x="366" y="591.5" text-anchor="end" class="mut" font-size="11">local transcripts</text>
<text x="24" y="631.5" class="lbl" font-size="13">Last 7 / 30 / 90 d</text>
<text x="366" y="631.5" text-anchor="end" class="num" font-size="12">300 s</text>
<g transform="rotate(-90 32 650.5)"><circle cx="32" cy="650.5" r="8" class="face"/><circle cx="32" cy="650.5" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="48" y="655.5" class="num" font-size="12">7 d</text>
<g transform="rotate(-90 91.6 650.5)"><circle cx="91.6" cy="650.5" r="8" class="face"/><circle cx="91.6" cy="650.5" r="8" class="hand" style="animation-duration:720s"/></g>
<text x="107.6" y="655.5" class="num" font-size="12">30 d</text>
<g transform="rotate(-90 158.39999999999998 650.5)"><circle cx="158.39999999999998" cy="650.5" r="8" class="face"/><circle cx="158.39999999999998" cy="650.5" r="8" class="hand" style="animation-duration:2160s"/></g>
<text x="174.39999999999998" y="655.5" class="num" font-size="12">90 d</text>
<line x1="24" x2="366" y1="669.5" y2="669.5" class="rule"/>
<text x="24" y="695.5" class="lbl" font-size="13">Claude token refresh</text>
<text x="366" y="695.5" text-anchor="end" class="num" font-size="12">on expiry</text>
<text x="24" y="719.5" class="mut" font-size="11">the only write</text>
<line x1="24" x2="366" y1="733.5" y2="733.5" class="rule"/>
<line x1="24" x2="366" y1="743.5" y2="743.5" class="rule"/>
<text x="24" y="769.5" class="hd" font-size="11">DASHBOARD BARS</text>
<rect x="24" y="783.5" width="20" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="791.5" class="mut" font-size="11">under 70% used</text>
<rect x="152.39999999999998" y="783.5" width="20" height="6" rx="3" fill="#d29922"/>
<text x="178.39999999999998" y="791.5" class="mut" font-size="11">70% and over</text>
<rect x="267.59999999999997" y="783.5" width="20" height="6" rx="3" fill="#f85149"/>
<text x="293.59999999999997" y="791.5" class="mut" font-size="11">90% and over</text>
<text x="24" y="817.5" class="mut" font-size="11">Clocks drain at 1 s per hour of window: a 5 h</text>
<text x="24" y="834" class="mut" font-size="11">window empties every 5 s, 7 days every 168 s, 90</text>
<text x="24" y="850.5" class="mut" font-size="11">days every 2160 s.</text>
<text x="24" y="872.5" class="mut" font-size="11">on load: the shipped usage/accounts.json turns this</text>
<text x="24" y="889" class="mut" font-size="11">poll timer off, so the tracker fetches once at</text>
<text x="24" y="905.5" class="mut" font-size="11">startup, then on every page load and on Refresh</text>
<text x="24" y="922" class="mut" font-size="11">now.</text>
</svg>
