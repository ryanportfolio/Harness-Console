<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 954" width="900" height="954" role="img" aria-label="Harness Console: the app on port 43127, the usage tracker on port 4545. Usage tracker schedule board: 4 Claude Code rate-limit windows and 2 Codex windows, fetched through CLIProxyAPI at startup, on page load and on Refresh now with no poll timer; token totals over 7, 30 and 90 days rescanned every 300 seconds; and the sign-in watch, which refreshes every 5 seconds for up to 10 minutes after the proxy's sign-in page opens.">
<style>
.ttl{font-family:'Untitled Serif',ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;font-weight:400;fill:#f6f3f1;letter-spacing:-0.02em}
.lbl{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#f6f3f1;letter-spacing:-0.02em}
.bdy{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#d9d4d0;letter-spacing:-0.02em}
.mut{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#a29e9b;letter-spacing:-0.02em}
.hd{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#a29e9b;letter-spacing:0.08em}
.num{font-family:'ABC Diatype Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;fill:#f6f3f1;font-variant-numeric:tabular-nums}
.rule{stroke:#4e4d4d;stroke-width:1}
.card{fill:#242424;stroke:#4e4d4d;stroke-width:1}
.pill{fill:none;stroke:#4e4d4d;stroke-width:1}
.face{fill:none;stroke:#3a3938;stroke-width:3}
.hand{fill:none;stroke:#f6f3f1;stroke-width:3;stroke-dasharray:50.27;stroke-dashoffset:0;animation-name:drain;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:50.27}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hand{stroke-dashoffset:0}}</style>
<defs><filter id="w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff9473" stop-opacity="0.55"/><stop offset="1" stop-color="#a0b5eb" stop-opacity="0.55"/></linearGradient><clipPath id="c"><rect x="0.5" y="0.5" width="899" height="953" rx="40"/></clipPath></defs>
<rect x="0.5" y="0.5" width="899" height="953" rx="40" class="card"/>
<g clip-path="url(#c)"><ellipse cx="760" cy="40" rx="220" ry="90" fill="url(#g)" filter="url(#w)"/></g>
<text x="40" y="92" class="ttl" font-size="48">Harness Console</text>
<text x="40" y="128" class="bdy" font-size="16">One local app for Harness Firmware repositories, plus a usage</text>
<text x="40" y="152" class="bdy" font-size="16">tracker: rate-limit windows and reset clocks for every Claude</text>
<text x="40" y="176" class="bdy" font-size="16">Code and Codex login in CLIProxyAPI, and token totals from this</text>
<text x="40" y="200" class="bdy" font-size="16">machine's transcripts.</text>
<rect x="40" y="225" width="96" height="24" rx="18" class="pill"/><text x="52" y="242" class="mut" font-size="12">APP :43127</text>
<rect x="144" y="225" width="103.2" height="24" rx="18" class="pill"/><text x="156" y="242" class="mut" font-size="12">USAGE :4545</text>
<rect x="255.2" y="225" width="124.8" height="24" rx="18" class="pill"/><text x="267.2" y="242" class="mut" font-size="12">0 DEPENDENCIES</text>
<text x="40" y="290" text-anchor="start" class="hd" font-size="11">WINDOW</text>
<text x="340" y="290" text-anchor="start" class="hd" font-size="11">LENGTH</text>
<text x="590" y="290" text-anchor="start" class="hd" font-size="11">POLLED</text>
<text x="690" y="290" text-anchor="start" class="hd" font-size="11">SOURCE</text>
<line x1="40" x2="860" y1="300" y2="300" class="rule"/>
<circle cx="45" cy="331" r="5" fill="#e0824f"/>
<text x="58" y="336" class="lbl" font-size="15">Claude Code</text>
<text x="690" y="336" text-anchor="start" class="mut" font-size="13">api.anthropic.com</text>
<text x="40" y="378" class="lbl" font-size="15">Session (5h)</text>
<g transform="rotate(-90 348 373)"><circle cx="348" cy="373" r="8" class="face"/><circle cx="348" cy="373" r="8" class="hand" style="animation-duration:5s"/></g>
<text x="364" y="378" class="num" font-size="14">5 h</text>
<text x="590" y="378" text-anchor="start" class="num" font-size="14">on load</text>
<text x="690" y="378" class="mut" font-size="13">/api/oauth/usage</text>
<line x1="40" x2="860" y1="392" y2="392" class="rule"/>
<text x="40" y="420" class="lbl" font-size="15">Weekly</text>
<g transform="rotate(-90 348 415)"><circle cx="348" cy="415" r="8" class="face"/><circle cx="348" cy="415" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="364" y="420" class="num" font-size="14">7 d</text>
<text x="590" y="420" text-anchor="start" class="num" font-size="14">on load</text>
<text x="690" y="420" class="mut" font-size="13">/api/oauth/usage</text>
<line x1="40" x2="860" y1="434" y2="434" class="rule"/>
<text x="40" y="462" class="lbl" font-size="15">Weekly Opus</text>
<text x="149" y="462" class="mut" font-size="12">when the plan reports it</text>
<g transform="rotate(-90 348 457)"><circle cx="348" cy="457" r="8" class="face"/><circle cx="348" cy="457" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="364" y="462" class="num" font-size="14">7 d</text>
<text x="590" y="462" text-anchor="start" class="num" font-size="14">on load</text>
<text x="690" y="462" class="mut" font-size="13">/api/oauth/usage</text>
<line x1="40" x2="860" y1="476" y2="476" class="rule"/>
<text x="40" y="504" class="lbl" font-size="15">Weekly Sonnet</text>
<text x="167" y="504" class="mut" font-size="12">when the plan reports it</text>
<g transform="rotate(-90 348 499)"><circle cx="348" cy="499" r="8" class="face"/><circle cx="348" cy="499" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="364" y="504" class="num" font-size="14">7 d</text>
<text x="590" y="504" text-anchor="start" class="num" font-size="14">on load</text>
<text x="690" y="504" class="mut" font-size="13">/api/oauth/usage</text>
<line x1="40" x2="860" y1="518" y2="518" class="rule"/>
<circle cx="45" cy="535" r="5" fill="#7d9df0"/>
<text x="58" y="540" class="lbl" font-size="15">Codex</text>
<text x="690" y="540" text-anchor="start" class="mut" font-size="13">chatgpt.com</text>
<text x="40" y="582" class="lbl" font-size="15">Session (5h)</text>
<g transform="rotate(-90 348 577)"><circle cx="348" cy="577" r="8" class="face"/><circle cx="348" cy="577" r="8" class="hand" style="animation-duration:5s"/></g>
<text x="364" y="582" class="num" font-size="14">5 h</text>
<text x="590" y="582" text-anchor="start" class="num" font-size="14">on load</text>
<text x="690" y="582" class="mut" font-size="13">/backend-api/wham/usage</text>
<line x1="40" x2="860" y1="596" y2="596" class="rule"/>
<text x="40" y="624" class="lbl" font-size="15">Weekly</text>
<g transform="rotate(-90 348 619)"><circle cx="348" cy="619" r="8" class="face"/><circle cx="348" cy="619" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="364" y="624" class="num" font-size="14">7 d</text>
<text x="590" y="624" text-anchor="start" class="num" font-size="14">on load</text>
<text x="690" y="624" class="mut" font-size="13">/backend-api/wham/usage</text>
<line x1="40" x2="860" y1="638" y2="638" class="rule"/>
<text x="40" y="660" class="lbl" font-size="15">Tokens</text>
<text x="690" y="660" text-anchor="start" class="mut" font-size="13">local transcripts</text>
<text x="40" y="702" class="lbl" font-size="15">Last 7 / 30 / 90 d</text>
<g transform="rotate(-90 348 697)"><circle cx="348" cy="697" r="8" class="face"/><circle cx="348" cy="697" r="8" class="hand" style="animation-duration:168s"/></g>
<text x="364" y="702" class="num" font-size="14">7 d</text>
<g transform="rotate(-90 411.2 697)"><circle cx="411.2" cy="697" r="8" class="face"/><circle cx="411.2" cy="697" r="8" class="hand" style="animation-duration:720s"/></g>
<text x="427.2" y="702" class="num" font-size="14">30 d</text>
<g transform="rotate(-90 482.8 697)"><circle cx="482.8" cy="697" r="8" class="face"/><circle cx="482.8" cy="697" r="8" class="hand" style="animation-duration:2160s"/></g>
<text x="498.8" y="702" class="num" font-size="14">90 d</text>
<text x="590" y="702" text-anchor="start" class="num" font-size="14">300 s</text>
<text x="690" y="702" class="mut" font-size="13">usage/.state/tokens/</text>
<line x1="40" x2="860" y1="716" y2="716" class="rule"/>
<text x="40" y="738" class="lbl" font-size="15">CLIProxyAPI</text>
<text x="690" y="738" text-anchor="start" class="mut" font-size="13">127.0.0.1:8317</text>
<text x="40" y="780" class="lbl" font-size="15">Sign-in watch</text>
<text x="340" y="780" class="mut" font-size="13">up to 10 min</text>
<text x="590" y="780" text-anchor="start" class="num" font-size="14">5 s</text>
<text x="690" y="780" class="mut" font-size="13">/management.html</text>
<line x1="40" x2="860" y1="794" y2="794" class="rule"/>
<line x1="40" x2="860" y1="806" y2="806" class="rule"/>
<text x="40" y="834" class="hd" font-size="11">DASHBOARD BARS</text>
<rect x="155.64" y="824" width="34" height="10" fill="#edddc3"/><rect x="157.64" y="826" width="30" height="6" fill="#ba9d6a"/>
<text x="195.64" y="834" class="mut" font-size="12">under 70% used</text>
<rect x="318.44" y="824" width="34" height="10" fill="#edddc3"/><rect x="320.44" y="826" width="30" height="6" fill="#8f774b"/>
<text x="358.44" y="834" class="mut" font-size="12">70% and over</text>
<rect x="466.84" y="824" width="34" height="10" fill="#edddc3"/><rect x="468.84" y="826" width="30" height="6" fill="#1e211e"/>
<text x="506.84" y="834" class="mut" font-size="12">90% and over</text>
<text x="40" y="862" class="mut" font-size="12">Clocks drain at 1 s per hour of window: a 5 h window empties every 5 s, 7 days every 168 s, 90 days every 2160 s.</text>
<text x="40" y="886" class="mut" font-size="12">on load: no poll timer. Each login is fetched through CLIProxyAPI at startup, on every page load and on Refresh</text>
<text x="40" y="904" class="mut" font-size="12">now; one fetched fine under 60 s ago, and neither flagged nor marked unavailable by the proxy, keeps its numbers.</text>
</svg>
